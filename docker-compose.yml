services:
  postgres:
    image: postgres:17-alpine
    container_name: aip-postgres
    environment:
      POSTGRES_USER: aip
      POSTGRES_PASSWORD: aip_dev_password
      POSTGRES_DB: aip
    # Host port 5433 avoids clashing with a locally installed Postgres on 5432.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - aip-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aip -d aip"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  aip-pgdata:
